{% extends "base.html" %}

{% block title %}회원가입 - {{ site_name }}{% endblock %}

{% block content %}
<div class="center-layout signup-layout">
    <section class="login-card signup-card">
        <a href="{{ url_for('home') }}" class="logo auth-logo">{{ site_name|upper }}</a>
        <h2 class="plain-title">회원가입</h2>
        <p class="auth-copy">실제 서비스 이용에 필요한 최소 정보만 입력받습니다.</p>

        <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

            <div class="input-group">
                <label for="userid">아이디</label>
                <div class="input-with-btn">
                    <input id="userid" type="text" name="userid" placeholder="4자 이상" autocomplete="username" required minlength="4">
                    <button type="button" class="small-btn" onclick="checkUserid()">중복확인</button>
                </div>
            </div>

            <div class="input-group">
                <label for="nickname">닉네임</label>
                <input id="nickname" type="text" name="nickname" placeholder="서비스에 표시되는 이름" autocomplete="nickname" required>
            </div>

            <div class="input-group">
                <label for="email">이메일</label>
                <input id="email" type="email" name="email" placeholder="example@email.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input id="password" type="password" name="password" placeholder="8자 이상" autocomplete="new-password" required minlength="8">
            </div>

            <div class="input-group">
                <label for="password_confirm">비밀번호 확인</label>
                <input id="password_confirm" type="password" name="password_confirm" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required minlength="8">
            </div>

            <div class="agreement-box">
                <input type="checkbox" id="agree" required>
                <label for="agree">[필수] 개인정보처리방침 및 이용약관에 동의합니다.</label>
            </div>

            <button type="submit" class="primary-btn">가입 완료</button>
        </form>

        <p class="auth-footnote">
            이미 계정이 있으신가요?
            <a href="{{ url_for('login') }}" class="text-link-inline">로그인</a>
        </p>
        <p class="auth-footnote">
            가입 전 <a href="{{ url_for('privacy') }}" class="text-link-inline">개인정보처리방침</a>과
            <a href="{{ url_for('terms') }}" class="text-link-inline">이용약관</a>을 확인해 주세요.
        </p>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
    function checkUserid() {
        const userid = document.getElementById("userid").value.trim();

        if (!userid) {
            alert("아이디를 입력해 주세요.");
            return;
        }

        fetch(`/check-userid?userid=${encodeURIComponent(userid)}`)
            .then((response) => response.json())
            .then((data) => alert(data.message))
            .catch(() => alert("중복 확인 중 오류가 발생했습니다."));
    }
</script>
{% endblock %}
