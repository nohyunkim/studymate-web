[project]
name = "studymate-cloudflare"
version = "0.1.0"
description = "StudyMate Cloudflare Worker deployment"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.2",
    "sqlalchemy>=2.0.43",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "pywrangler>=0.0.2",
    "workers-py>=1.9.2",
    "workers-runtime-sdk>=0.0.19",
]
